# Local development stack: Neo4j (graph store) + Ollama (local LLM/embeddings).
# Ports are bound to 127.0.0.1 only, so services are not reachable from other hosts.
name: financial-graphrag

services:
  neo4j:
    image: neo4j:2026.08.1-community
    container_name: fg-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      # No plugins and no usage reporting in local development.
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474" # Browser / HTTP
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687" # Bolt (used by the Go driver)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  ollama:
    image: ollama/ollama:0.34.4
    container_name: fg-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      # Models are pulled manually once (see README) and persisted here.
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_models:
